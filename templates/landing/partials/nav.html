{% load static %}
<nav class="l-nav" data-screen-label="00 Nav">
  <div class="l-container d-flex flex-row py-4 px-4 justify-content-between">
    <!-- LOGO -->
    <a class="logo" href="#"><img src="{% static 'images/logo-horizontal.png' %}" alt="Frozen 1000"></a>

    <!-- LINKS -->
    <ul class="d-flex align-items-center text-center">
      {% for link in nav_links %}
        <li><a href="{{ link.href }}">{{ link.label }}</a></li>
      {% endfor %}
    </ul>

    <!-- SHOP -->
    <div class="right">
      <span class="pulse"><span class="dot"></span>12 lojas · ao vivo</span>
      
      <a href="#cardapio" class="btn btn-mag">
        Pedir agora <i data-lucide="arrow-right" style="width:14px;height:14px;stroke-width:1.75"></i>
      </a>

      <button class="btn btn-icon burger" type="button" aria-label="menu"
              data-bs-toggle="offcanvas" data-bs-target="#mobileNav" aria-controls="mobileNav">
        <i data-lucide="menu" style="width:20px;height:20px;stroke-width:1.75"></i>
      </button>
    </div>
  </div>
</nav>

{# Bootstrap offcanvas — the mobile burger now actually opens a menu #}
<div class="offcanvas offcanvas-end f1k-offcanvas" tabindex="-1" id="mobileNav" aria-labelledby="mobileNavLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="mobileNavLabel">FROZEN · 1000</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
  </div>
  <div class="offcanvas-body">
    <ul class="nav flex-column">
      {% for link in nav_links %}
        <li class="nav-item"><a class="nav-link" href="{{ link.href }}" data-bs-dismiss="offcanvas">{{ link.label }}</a></li>
      {% endfor %}
    </ul>
  </div>
</div>
