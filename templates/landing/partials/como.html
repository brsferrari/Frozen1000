<section class="how" id="como" data-screen-label="05 Como funciona">
  <div class="l-container">
    <div class="how-head">
      <div>
        <span class="how-ey">Pronto em 90 segundos</span>
        <h2>Como funciona<br><span class="alt">a loja-nave.</span></h2>
      </div>
      <div class="timer">
        <span class="t" id="liveTimer">00:00</span>
        <span class="l">Cronômetro do ciclo</span>
      </div>
    </div>

    <div class="steps">
      {% for s in steps %}
        <div class="step">
          <span class="num-tag">/{{ forloop.counter|stringformat:"02d" }}</span>
          <div class="ic"><i data-lucide="{{ s.ic }}" style="width:22px;height:22px;color:#fff;stroke-width:1.75"></i></div>
          <h4>{{ s.nm }}</h4>
          <p>{{ s.desc }}</p>
          <div class="timing">{{ s.t }}</div>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
