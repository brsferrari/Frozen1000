<div class="f1k-modal" id="promptModal" role="dialog" aria-modal="true" aria-labelledby="promptModalTitle" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head">
      <div class="l-row">
        <span class="id-tag" data-modal-id-tag>IMG · —</span>
        <h3 id="promptModalTitle" data-modal-title></h3>
      </div>
      <button class="modal-close" type="button" aria-label="fechar" data-modal-close>
        <i data-lucide="x" style="width:18px;height:18px;color:#fff;stroke-width:1.75"></i>
      </button>
    </div>
    <div class="modal-body">
      <div class="lab">Prompt IA · copie & cole no seu gerador</div>
      <div class="prompt-box" data-modal-prompt></div>
    </div>
    <div class="modal-foot">
      <span class="copy-msg" data-copy-msg>✓ Prompt copiado</span>
      <button type="button" class="btn btn-ghost" data-modal-close>Fechar</button>
      <button type="button" class="btn btn-mag" data-modal-copy>
        <i data-lucide="copy" style="width:14px;height:14px;color:#fff;stroke-width:1.75"></i> Copiar prompt
      </button>
    </div>
  </div>
</div>
