{% load static %}
<section class="ig" id="instagram" data-screen-label="10 Instagram">
  <div class="l-container">
    <div class="head">
      <span class="ey">Divirta-se com a gente</span>
      <h2>No <span class="alt">@frozen1000</span></h2>
      <div class="handle">
        <div class="av"><img src="{% static 'images/frizz.png' %}" alt=""></div>
        <div>
          <div>@frozen1000</div>
          <div class="meta-sub">128k seguidores · frozen1000.com.br</div>
        </div>
      </div>
    </div>

    <div class="ig-grid">
      {% for slot in ig_list %}
        <div class="ig-post">
          {% include "landing/partials/slot.html" with slot=slot %}
          <div class="ovr">▶ {{ slot.label }}</div>
        </div>
      {% endfor %}
    </div>

    <div class="ctas">
      <a href="#" class="btn btn-ghost btn-xl">Ver mais</a>
      <a href="https://instagram.com/frozen1000" target="_blank" rel="noopener noreferrer" class="btn btn-mag btn-xl">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="1" fill="#fff"></circle>
        </svg>
        Seguir no Instagram
      </a>
    </div>
  </div>
</section>
