<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Frozen 1000 — Gelados inteligentes. Experiências do futuro.</title>
    <meta name="description" content="Frozen, açaí, café e sundae prontos em 90 segundos. Sabor e tecnologia. Na medida certa.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  </head>
  <body data-screen-label="landing">
    <div class="fx-bg" aria-hidden="true">
      <div class="fx-grid"></div>
      <div class="fx-spot" id="fxSpot"></div>
      <div class="fx-scan"></div>
    </div>
    <div id="root"></div>
    <script type="text/babel" data-presets="react" src="app.jsx"></script>
    <script>
      /* Mouse-tracked spotlight */
      (function(){
        const spot = document.getElementById('fxSpot');
        let raf = 0, tx = 50, ty = 30;
        window.addEventListener('pointermove', (e) => {
          tx = (e.clientX / window.innerWidth) * 100;
          ty = ((e.clientY + window.scrollY) / (window.innerHeight + window.scrollY * .1)) * 100;
          if (!raf) raf = requestAnimationFrame(apply);
        });
        function apply(){
          spot.style.setProperty('--mx', tx + '%');
          spot.style.setProperty('--my', ty + '%');
          raf = 0;
        }
      })();
    </script>
  </body>
</html>
